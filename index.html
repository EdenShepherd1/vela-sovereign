<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060913">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vela">
<meta name="description" content="A turn-based space 4X strategy game for your phone.">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Vela Sovereign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed star chart, slim status strip on top, command dock below, slide-up sheets for every screen */
:root{
  --void:#060913; --panel:#0e1426; --panel2:#151d36; --line:#25304f; --ink:#dfe5f3; --dim:#8a94b0;
  --brass:#e7b25a; --sci:#5fd0c9; --food:#8fd16a; --ind:#e8894a; --bc:#f2d36b; --danger:#ef5f5f; --good:#6fd18d;
  --f-disp:'Chakra Petch','Trebuchet MS',sans-serif; --f-body:'Barlow',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(var(--panel),rgba(14,20,38,.92));border-bottom:1px solid var(--line);z-index:5}
#top .sd{font-family:var(--f-disp);font-weight:600;letter-spacing:.06em;font-size:13px;color:var(--brass);white-space:nowrap}
#top .sd small{display:block;color:var(--dim);font-size:10px;letter-spacing:.14em}
#top .stats{margin-left:auto;display:flex;gap:12px;font-size:12px}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat b{font-family:var(--f-mono);font-weight:600;font-size:13px}
.stat span{font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-family:var(--f-disp)}
#mapwrap{flex:1;position:relative;overflow:hidden;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#endTurn{position:absolute;right:14px;bottom:14px;z-index:4;font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;font-size:14px;padding:14px 18px;border-radius:4px;background:var(--brass);color:#1b1306;box-shadow:0 0 0 1px #f6d79c inset,0 6px 24px rgba(231,178,90,.25)}
#endTurn:active{transform:translateY(1px)}
#moveBanner{position:absolute;left:12px;right:12px;top:10px;z-index:4;background:rgba(14,20,38,.95);border:1px solid var(--brass);border-radius:4px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px}
#moveBanner button{margin-left:auto}
#dock{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:1px solid var(--line);z-index:25;position:relative}
#dock button{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#dock button.on{color:var(--brass)}
#dock svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-family:var(--f-mono);line-height:16px}

/* bottom star panel */
#starPanel{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:rgba(12,17,33,.97);border-top:1px solid var(--line);z-index:3;padding:12px 16px 80px;border-radius:12px 12px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ph h2{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.04em;margin:0}
.ph .sub{color:var(--dim);font-size:12px}
.ph .x{margin-left:auto;font-size:22px;color:var(--dim);padding:0 4px;line-height:1}
.lbl{font-family:var(--f-disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.prow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(37,48,79,.6)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600}
.prow .mt{font-size:12px;color:var(--dim)}
.pdot{width:22px;height:22px;border-radius:50%;justify-self:center;box-shadow:inset -5px -4px 8px rgba(0,0,0,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--brass);color:#1b1306;border-color:var(--brass)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.frow{padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:rgba(21,29,54,.6)}
.frow .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--dim)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.note{font-size:13px;color:var(--dim);line-height:1.45}
.warnTxt{color:var(--danger)}

/* full sheets */
#sheet{position:fixed;top:0;left:0;right:0;bottom:calc(var(--dockH,58px) + env(safe-area-inset-bottom,0px));z-index:20;background:var(--void);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#sheet .sh h1{font-family:var(--f-disp);font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin:0;font-weight:700}
#sheet .sh .x{margin-left:auto;font-size:26px;line-height:1;color:var(--dim)}
#sheet .sb{flex:1;overflow-y:auto;padding:14px 16px 28px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.kv span:first-child{color:var(--dim)}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.jobs{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.jobrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(37,48,79,.6)}
.jobrow:last-child{border-bottom:0}
.jobrow .ic{width:30px;text-align:center;font-family:var(--f-disp);font-weight:700}
.jobrow .who{flex:1}
.jobrow .who small{display:block;color:var(--dim);font-size:11px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:600}
.step b{min-width:22px;text-align:center;font-family:var(--f-mono)}
.out{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.out div{text-align:center;padding:8px 2px;border-radius:4px;background:rgba(255,255,255,.04)}
.out b{display:block;font-family:var(--f-mono);font-size:16px}
.out span{font-size:9px;letter-spacing:.14em;color:var(--dim);font-family:var(--f-disp);text-transform:uppercase}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);margin-bottom:6px}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:600}
.opt .t small{color:var(--dim);font-size:12px;line-height:1.35;display:block}
.opt .c{font-family:var(--f-mono);font-size:12px;color:var(--ind);white-space:nowrap}
.opt.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.tier{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tier .opt{flex-direction:column;align-items:flex-start;margin:0}
.fieldhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fieldhead b{font-family:var(--f-disp);letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.pips{display:flex;gap:3px;margin-left:auto}
.pips i{width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.1)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--brass);color:#1b1306}
.qitem{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.qitem .x{margin-left:auto;color:var(--dim);font-size:18px;padding:0 6px}

/* modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(3,5,12,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
#modal h3{font-family:var(--f-disp);letter-spacing:.06em;font-size:18px;margin:0 0 4px;text-transform:uppercase}
#modal p{line-height:1.5;margin:8px 0;font-size:14px}
#bcv{width:100%;height:260px;display:block;background:#04060d;border:1px solid var(--line);border-radius:4px;margin:8px 0}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(37,48,79,.6);font-size:13px;line-height:1.4}
.ev i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px}

/* start screen */
#start{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#1a2346 0%,var(--void) 60%);padding:calc(24px + env(safe-area-inset-top,0px)) 16px 40px}
#start .wrap{max-width:560px;margin:0 auto}
#start h1{font-family:var(--f-disp);font-weight:700;font-size:40px;letter-spacing:.08em;line-height:1;margin:18px 0 6px;text-wrap:balance;color:var(--brass)}
#start .lead{color:var(--dim);line-height:1.5;max-width:46ch}
.races{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.race{text-align:left;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.race b{font-family:var(--f-disp);letter-spacing:.06em;font-size:15px;display:block}
.race small{font-size:12px;color:var(--dim);line-height:1.35;display:block;margin-top:3px}
.race.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));z-index:60;background:var(--panel2);border:1px solid var(--brass);padding:8px 14px;border-radius:4px;font-size:13px;max-width:90%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div id="app">
  <header id="top">
    <div class="sd"><small>STARDATE</small><span id="sd" class="num">3500.0</span></div>
    <div class="stats">
      <div class="stat"><b id="sBC" style="color:var(--bc)">0</b><span>Credits</span></div>
      <div class="stat"><b id="sRP" style="color:var(--sci)">0</b><span>Research</span></div>
      <div class="stat"><b id="sFood" style="color:var(--food)">0</b><span>Food</span></div>
      <div class="stat"><b id="sPop">0</b><span>Pop</span></div>
    </div>
  </header>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="moveBanner" hidden><span id="moveTxt"></span><button class="btn sm" data-act="cancelMove">Cancel</button></div>
    <button id="endTurn" data-act="endTurn">END TURN</button>
    <div id="starPanel" hidden></div>
  </div>
  <nav id="dock">
    <button data-act="tab" data-t="galaxy" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/></svg>Galaxy</button>
    <button data-act="tab" data-t="colonies"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M5 12h14M12 5c3 3 3 11 0 14"/></svg>Planets</button>
    <button data-act="tab" data-t="research"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg><span>Research <span id="rBadge"></span></span></button>
    <button data-act="tab" data-t="fleets"><svg viewBox="0 0 24 24"><path d="M3 18 12 4l9 14-9-4z"/></svg>Fleets</button>
    <button data-act="tab" data-t="races"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c1-3 3-4 5-4s4 1 5 4M11 19c1-3 3-4 5-4s4 1 5 4"/></svg>Empires</button>
    <button data-act="tab" data-t="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
  </nav>
</div>
<div id="sheet" hidden><div class="sh"><h1 id="shT"></h1><button class="x" data-act="closeSheet" aria-label="Close">×</button></div><div class="sb" id="shB"></div></div>
<div id="modal" hidden><div class="box" id="mB"></div></div>
<div id="start" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ================= DATA ================= */
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const wIdx=w=>{let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i;}return w.length-1;};
const ROMAN=['I','II','III','IV','V','VI'];
const fmt=n=>(Math.round(n*10)/10).toString();

const PT={
  'Gaia':{food:3,pop:6,col:'#58c98b'},'Terran':{food:2,pop:5,col:'#4f9ed8'},'Ocean':{food:2,pop:5,col:'#2f6fd0'},
  'Swamp':{food:1,pop:4,col:'#6f8f45'},'Arid':{food:1,pop:4,col:'#c79a5a'},'Tundra':{food:1,pop:4,col:'#b9d6de'},
  'Desert':{food:1,pop:3,col:'#d6b366'},'Barren':{food:0,pop:2,col:'#8a8079'},'Inferno':{food:0,pop:1,col:'#d9583b'},
  'Toxic':{food:0,pop:1,col:'#9bc23a'},'Radiated':{food:0,pop:1,col:'#c45cc4'},

const RACES=[
  {id:'varnai',name:'Varnai',empire:'Varnai Concordat',blurb:'Silver-tongued traders. +50% income; rivals start friendlier.',t:{bc:1.5,charm:15}},
  {id:'kesh',name:"Kesh'tar",empire:"Kesh'tar Hive",blurb:'Tireless builders. +1 production per worker, research −25%.',t:{ind:1,rp:0.75}},
  {id:'lumen',name:'Lumenari',empire:'Lumenari Lyceum',blurb:'Psionic scholars. +1 research per scientist, weak marines.',t:{sci:1,ground:0.7}},
  {id:'drakk',name:'Drakkan',empire:'Drakkan Dominion',blurb:'Born for war. +2 ship accuracy, double marine strength.',t:{acc:2,ground:2}},
  {id:'thal',name:'Thalassi',empire:'Thalassi Tide',blurb:'Tidal farmers. +1 food per farmer, +50% population growth.',t:{food:1,growth:1.5}},
  {id:'mekon',name:'Mekon',empire:'Mekon Collective',blurb:'Machine minds. Need no food at all, grow 40% slower.',t:{nofood:true,growth:0.6}}
];
const RACE=Object.fromEntries(RACES.map(r=>[r.id,r]));
const EMP_COL=['#e7b25a','#e2566a','#9b82f2','#46c4a3'];

const HULLS={
  frigate:{name:'Frigate',space:25,hp:6,cost:12,eva:3},
  destroyer:{name:'Destroyer',space:60,hp:14,cost:28,eva:2},
  cruiser:{name:'Cruiser',space:120,hp:30,cost:65,eva:1},
  battleship:{name:'Battleship',space:250,hp:65,cost:140,eva:0},

};
const HULL_ORDER=['frigate','destroyer','cruiser','battleship','titan','doom'];

  laser:{name:'Laser',min:1,max:4,space:10,cost:3,f:'phy',tier:0,beam:true},
  massdriver:{name:'Mass Driver',min:2,max:6,space:10,cost:4,f:'phy',tier:1,beam:true},
  neutron:{name:'Neutron Blaster',min:3,max:12,space:15,cost:7,f:'phy',tier:2,beam:true},
  graviton:{name:'Graviton Beam',min:6,max:16,space:19,cost:10,f:'phy',tier:3,beam:true},
  plasma:{name:'Plasma Cannon',min:6,max:30,space:24,cost:15,f:'phy',tier:4,beam:true},
  deathray:{name:'Death Ray',min:12,max:50,space:30,cost:24,f:'phy',tier:5,beam:true},
  nuke:{name:'Nuclear Missile',min:8,max:8,space:18,cost:5,f:'chem',tier:1,missile:true,acc:1},
  merculite:{name:'Merculite Missile',min:11,max:11,space:18,cost:7,f:'chem',tier:2,missile:true,acc:2},

const BLD={

  barracks:{name:'Marine Barracks',cost:60,m:1,d:'+4 marines defending the planet.'},
  af:{name:'Automated Factory',cost:60,m:1,d:'+5 production, +1 per worker.'},
  rf:{name:'Robotic Factory',cost:150,m:2,d:'+10 production, +1 per worker.'},
  dcm:{name:'Deep Core Mine',cost:250,m:3,d:'+15 production, +2 per worker.'},
  sf:{name:'Star Fortress',cost:250,m:3,d:'Heavy orbital fortress. 150 structure, 8 guns.',def:150,guns:8},
  pse:{name:'Stock Exchange',cost:200,m:0,d:'+8 credits per turn.'},
  mb:{name:'Missile Base',cost:120,m:2,d:'Ground silos. 30 structure, 4 missile launchers.',def:30,mguns:4},
  ps:{name:'Planetary Shield',cost:200,m:2,d:'Blocks 5 damage from every hit on this planet.'},
  pfs:{name:'Flux Shield',cost:350,m:3,d:'Blocks 10 damage from every hit on this planet.'},
  bar:{name:'Barrier Shield',cost:600,m:4,d:'Blocks 20 damage from every hit on this planet.'},
  rl:{name:'Research Lab',cost:60,m:1,d:'+5 research, +1 per scientist.'},
  sc:{name:'Supercomputer',cost:150,m:2,d:'+10 research, +1 per scientist.'},

function recompute(e){

  FIELDS.forEach(f=>{b.lvl[f.id]=f.tiers.filter(t=>t.some(x=>e.techs.includes(x.id))).length;});
  for(const id of e.techs){const x=TECH[id].e;
    if(x.bld)b.blds.add(x.bld); if(x.proj)b.proj.add(x.proj); if(x.hull)b.hulls.add(x.hull); if(x.weapon)b.weapons.add(x.weapon);
    if(x.acc)b.acc+=x.acc; if(x.eva)b.eva+=x.eva; if(x.beam)b.beam+=x.beam; if(x.speed)b.speed=Math.max(b.speed,x.speed);

    if(x.food)b.food+=x.food; if(x.ind)b.ind+=x.ind; if(x.sci)b.sci+=x.sci; if(x.ground)b.ground*=x.ground;
    if(x.shield)b.shield=Math.max(b.shield,x.shield); if(x.shieldAdd)b.shieldAdd+=x.shieldAdd; if(x.ign)b.ign=true; if(x.gate)b.gate=true; if(x.armor)b.armor=Math.max(b.armor,x.armor);
  }
  if(b.lvl.con>=1)b.hulls.add('cruiser'); if(b.lvl.con>=2)b.hulls.add('battleship'); if(b.lvl.con>=3)b.hulls.add('titan');
  e.b=b;

const aiMult=e=>e.isPlayer?1:({easy:.8,normal:1,hard:1.3}[S.opts.diff]||1);

function maxPop(e,p){const t=PT[p.type]; if(!t||t.op)return 0; let m=t.pop*(p.size+1); return m+e.b.maxpop+(has(p,'bio')?2:0);}
function yieldOf(e,p){
  const t=PT[p.type],b=e.b,r=RACE[e.race].t,cap=p.capital?1:0;
  const fpf=t.food>0?t.food+b.food+(has(p,'se')?1:0):0;
  const food=p.f*fpf+(has(p,'hf')?2:0)+cap*2;
  const need=r.nofood?0:Math.floor(p.pop);
  const ipw=MIN_PROD[p.min]+b.ind+(has(p,'af')?1:0)+(has(p,'rf')?1:0)+(has(p,'dcm')?2:0);
  let ind=p.w*ipw+(has(p,'af')?5:0)+(has(p,'rf')?10:0)+(has(p,'dcm')?15:0)+cap*5;
  ind*= (1+b.prod)*(e.debt?.5:1)*aiMult(e);
  const sps=3+b.sci+(has(p,'rl')?1:0)+(has(p,'sc')?1:0)+(has(p,'gc')?2:0);
  let rp=p.s*sps+(has(p,'rl')?5:0)+(has(p,'sc')?10:0)+(has(p,'gc')?15:0)+(has(p,'al')?30:0)+(has(p,'arch')?20:0)+cap*3;
  rp*=(r.rp||1)*(1+b.rp)*aiMult(e);
  let bc=(Math.floor(p.pop)*.5+(has(p,'pse')?8:0))*(r.bc||1)*(1+b.bc);
  return {food,need,ind:Math.round(ind),rp:Math.round(rp),bc,fpf,ipw,sps};
}
function growthOf(e,p){const m=maxPop(e,p); if(p.outpost||p.pop>=m)return 0; let g=(.15+.1*Math.sqrt(p.pop))*(1-p.pop/m)*e.b.growth; if(has(p,'cc'))g+=.15; return g;}
function empTotals(e){const t={food:0,need:0,ind:0,rp:0,bc:0,maint:0,pop:0};
  for(const p of cols(e)){ if(p.outpost)continue; const y=yieldOf(e,p); t.food+=y.food;t.need+=y.need;t.ind+=y.ind;t.rp+=y.rp;t.bc+=y.bc;t.pop+=Math.floor(p.pop);
    p.buildings.forEach(b=>t.maint+=BLD[b].m); }
  for(const f of S.fleets) if(f.owner===e.id) for(const s of f.ships) if(s.d.kind==='war'||s.d.kind==='transport') t.maint+=s.d.cost*.02;
  for(const o of S.empires) if(o.alive&&o.id!==e.id&&e.rel[o.id]){ const pr=Math.min(popOf(e),popOf(o)); if(e.rel[o.id].trade)t.bc+=pr*.15; if(e.rel[o.id].pact)t.rp+=pr*.25; }
  t.maint=Math.round(t.maint*10)/10; return t;}

function fixJobs(e,p){const n=p.outpost?0:Math.floor(p.pop); let tot=p.f+p.w+p.s;
  while(tot>n){ if(p.s>0)p.s--; else if(p.w>0)p.w--; else p.f--; tot--; }
  while(tot<n){ const t=empTotals(e); if(t.food<t.need+1&&yieldOf(e,p).fpf>0&&!RACE[e.race].t.nofood)p.f++; else p.w++; tot++; } }
function allocateJobs(e,ratio){
  const cs=cols(e).filter(p=>!p.outpost); cs.forEach(p=>{p.f=0;p.w=0;p.s=0;});
  if(!RACE[e.race].t.nofood){ let need=0,food=0; cs.forEach(p=>{const y=yieldOf(e,p);need+=Math.floor(p.pop);food+=y.food;});
    const farm=cs.filter(p=>yieldOf(e,p).fpf>0).sort((a,b)=>yieldOf(e,b).fpf-yieldOf(e,a).fpf);
    for(const p of farm){const fpf=yieldOf(e,p).fpf; while(food<need&&p.f<Math.floor(p.pop)){p.f++;food+=fpf;} if(food>=need)break;} }
  cs.forEach(p=>{const rem=Math.floor(p.pop)-p.f; p.s=Math.round(rem*ratio); p.w=rem-p.s;});
}

function bestBeam(e){let best='laser';for(const w of e.b.weapons)if(WEAPONS[w].beam&&WEAPONS[w].tier>WEAPONS[best].tier)best=w;return best;}
function bestMissile(e){let best=null;for(const w of e.b.weapons)if(WEAPONS[w].missile&&(!best||WEAPONS[w].tier>WEAPONS[best].tier))best=w;return best;}
function warStats(e,d){
  const H=HULLS[d.hull],W=WEAPONS[d.weapon],b=e.b;
  const space=H.space*(1+b.space), sh=d.shield?b.shield:0, shSpace=sh?H.space*.12:0, comp=b.acc>0?H.space*.05:0;
  const mini=Math.max(.5,1-.08*Math.max(0,(b.lvl[W.f]||0)-W.tier)), ws=W.space*mini;
  const count=Math.max(1,Math.floor((space-shSpace-comp)/ws));
  const hp=Math.round(H.hp*b.armor*(1+b.hullHp));
  const cost=Math.round(H.cost+count*W.cost+sh*H.space*.03+(b.armor-1)*H.cost*.2);
  return {kind:'war',name:d.name,hull:d.hull,weapon:d.weapon,count,shield:sh?sh+b.shieldAdd:0,acc:b.acc,eva:H.eva+b.eva,hp,cost,speed:b.speed,beam:b.beam,ign:b.ign};
}

function shipSpec(e,it){ if(it.kind==='war'){const d=e.designs.find(x=>x.id===it.designId)||e.designs[0]; return warStats(e,d);} return SPECIAL[it.kind](e); }
function makeShip(e,spec){return {id:nid(),d:spec,hp:spec.hp};}
function itemCost(e,it){ if(it.k==='bld')return BLD[it.id].cost; if(it.k==='proj')return PROJ[it.id].cost; if(it.k==='ship')return shipSpec(e,it).cost; return 0; }
function itemName(e,it){ if(it.k==='bld')return BLD[it.id].name; if(it.k==='proj')return PROJ[it.id].name; if(it.k==='ship')return shipSpec(e,it).name; return 'Trade Goods'; }
const fleetSpeed=f=>SPEED[Math.min(6,Math.min(...f.ships.map(s=>s.d.speed)))]||70;
const armed=f=>f.ships.some(s=>s.d.count>0);
const fleetsAt=sid=>S.fleets.filter(f=>f.star===sid);
function rangeOf(e){return 240+40*(e.b.lvl.pow||0)+e.b.range;}
function inRange(e,st){ if(st.rift)return e.b.gate; const R=rangeOf(e); return S.planets.some(p=>p.owner===e.id&&Math.hypot(ST(p.star).x-st.x,ST(p.star).y-st.y)<=R); }
function hostile(a,b){ if(a===b)return false; if(a<0&&b<0)return false; if(a<0||b<0)return true; return !!E(a).rel[b]?.war; }
function hostileArmedAt(oid,sid){ return fleetsAt(sid).some(f=>hostile(oid,f.owner)&&armed(f)); }
function shipAtk(d){ if(!d.count)return 0; const W=WEAPONS[d.weapon]; return d.count*(W.min+W.max)/2*(W.missile?.6:1)*(1+(d.beam||0)); }
function strength(ships){let a=0,h=0;for(const s of ships){a+=shipAtk(s.d);h+=s.hp+s.d.shield*3;}return Math.sqrt(a*h);}
function defMax(p){ if(p.owner==null||p.owner<0)return 0; const e=E(p.owner); let d=0; p.buildings.forEach(b=>{if(BLD[b].def)d+=BLD[b].def;}); return Math.round(d*Math.sqrt(e.b.armor)); }
function pShield(p){return has(p,'bar')?20:has(p,'pfs')?10:has(p,'ps')?5:0;}
function planetUnit(p){ const e=E(p.owner); let g=0,mg=0; p.buildings.forEach(b=>{g+=BLD[b].guns||0;mg+=BLD[b].mguns||0;});
  const w=[]; if(g)w.push({id:bestBeam(e),n:g}); if(mg)w.push({id:bestMissile(e)||bestBeam(e),n:mg});
  return {owner:p.owner,name:p.name,hp:p.def,max:defMax(p),shield:pShield(p),eva:-4,acc:e.b.acc+1,w,beam:e.b.beam,ign:e.b.ign,planet:p,kind:'planet'}; }
function planetStrength(p){ if(p.def<=0)return 0; const u=planetUnit(p); let a=0; u.w.forEach(m=>{const W=WEAPONS[m.id];a+=m.n*(W.min+W.max)/2;}); return Math.sqrt(a*(u.hp+u.shield*6)); }
function defenders(p){ if(p.outpost)return 0; const e=E(p.owner); return (Math.floor(p.pop)*.5+(has(p,'barracks')?4:0)+(p.capital?4:0))*e.b.ground; }

function newGame(opts){
  const N={small:20,medium:28,large:36}[opts.size]||28;
  const W=Math.round(Math.sqrt(N*42000/1.45)),H=Math.round(W*1.45);
  S={turn:0,W,H,stars:[],planets:[],empires:[],fleets:[],nextId:1,events:[],log:[],opts,council:{next:60},over:null,rift:null,replays:[],offers:[]};
  const names=shuffle(STAR_NAMES.slice()); let tries=0;
  while(S.stars.length<N&&tries<30000){tries++; const x=rnd(70,W-70),y=rnd(70,H-70);
    if(S.stars.every(s=>Math.hypot(s.x-x,s.y-y)>108)) S.stars.push({id:S.stars.length,x,y,name:names.pop(),cls:wIdx(SCLASS.map(c=>c.w)),planets:[]}); }
  const cx=W/2,cy=H/2; const vela=S.stars.reduce((a,s)=>Math.hypot(s.x-cx,s.y-cy)<Math.hypot(a.x-cx,a.y-cy)?s:a);
  vela.vela=true; vela.name='Vela'; vela.cls=3;
  // homes
  let bestH=null,bestD=-1; const pool=S.stars.filter(s=>!s.vela&&Math.hypot(s.x-vela.x,s.y-vela.y)>230);
  for(let k=0;k<400;k++){const c=shuffle(pool.slice()).slice(0,4); let md=1e9; for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)md=Math.min(md,Math.hypot(c[i].x-c[j].x,c[i].y-c[j].y)); if(md>bestD){bestD=md;bestH=c;}}
  const addP=(st,type,size,min,o,name)=>{const p={id:S.planets.length,star:st.id,orbit:o,name:name||st.name+' '+ROMAN[o],type,size,min,owner:null,pop:0,f:0,w:0,s:0,buildings:[],queue:[],prog:0,def:0,capital:false,outpost:false,blk:false};S.planets.push(p);st.planets.push(p.id);return p;};
  const tKeys=Object.keys(TYPE_W),tW=tKeys.map(k=>TYPE_W[k]);
  const randPlanet=(st,o)=>{const type=tKeys[wIdx(tW)]; const size=PT[type].op?2:wIdx([2,4,5,3,1]); const min=clamp(wIdx([1,3,6,3,1])+SCLASS[st.cls].m,0,4); return addP(st,type,size,min,o);};
  for(const st of S.stars){
    if(st.vela){addP(st,'Gaia',4,4,0,'Vela Prime');addP(st,'Asteroids',2,3,1);continue;}
    const hi=bestH.indexOf(st);
    if(hi>=0){ st.cls=0; randPlanet(st,0); addP(st,'Terran',2,2,1); if(Math.random()<.7)randPlanet(st,2); continue; }
    const n=Math.random()<.08?0:ri(1,4); for(let o=0;o<n;o++)randPlanet(st,o);
  }

const ownerName=o=>o===-1?'Monsters':o===-2?'The Hollow':E(o).name;

/* ===== Concord council ===== */
function councilCheck(){
  if(S.turn<S.council.next)return; S.council.next=S.turn+25;
  const al=S.empires.filter(e=>e.alive); if(al.length<3)return;
  const c=al.slice().sort((a,b)=>popOf(b)-popOf(a)).slice(0,2);
  S.vote={c:c.map(x=>x.id)};
}
function resolveVote(playerChoice){
  const v=S.vote; S.vote=null; const al=S.empires.filter(e=>e.alive); const tally={}; v.c.forEach(id=>tally[id]=0); let total=0; const lines=[];
  al.forEach(e=>{ const n=Math.max(1,popOf(e)); total+=n; let ch;

    if(ch!=null){tally[ch]+=n;} lines.push(`${e.name}: ${n} vote${n>1?'s':''} → ${ch==null?'abstain':E(ch).name}`); });
  const winner=v.c.find(id=>tally[id]>=total*2/3);
  let res; if(winner==null)res='No one reached two-thirds. The Concord adjourns for 25 turns.';
  else if(winner===0){res='You are elected Sovereign of the galaxy!';S.over={win:true,how:'council'};}
  else {res=`The ${E(winner).name} is elected Sovereign. Your empire bows to a new ruler.`;S.over={win:false,how:'council',by:winner};}
  return {lines,tally,total,res};
}

/* ===== turn ===== */
function endTurn(){
  if(S.over||S.vote)return;
  S.events=[]; S.replays=[];
  S.empires.forEach(aiTurn);
  S.empires.forEach(economy);
  moveFleets();
  hollowPhase();
  combats();
  hollowAftermath();
  S.empires.forEach(aiPost);
  S.turn++;
  updateExplore(); contacts();
  if(me().alive&&!me().researching&&availableTechs(me()).length)ev('Your scientists await a new research order.',2,0,'#5fd0c9');
  cols(me()).forEach(p=>{if(!p.outpost&&!p.queue.length)ev(`${p.name} is idle, making trade goods.`,1);});
  councilCheck();
  if(!S.over){ const live=S.empires.filter(e=>e.alive&&!e.isPlayer); if(!live.length)S.over={win:true,how:'conquest'}; }
  S.log=[...S.events.map(x=>({...x,turn:S.turn})),...S.log].slice(0,120);
}

    if(ex){ const pops=s.planets.map(id=>P(id)); const myPop=pops.filter(p=>p.owner===0&&!p.outpost).reduce((a,p)=>a+Math.floor(p.pop),0); if(myPop){ctx.font='600 10px "JetBrains Mono", monospace';ctx.fillStyle='#e7b25a';ctx.fillText(myPop,x,y+34);} }
  }
  // fleets
  const byStar={}; S.fleets.forEach(f=>{ if(!visibleToPlayer(f))return; if(f.owner===-2&&f.guard&&ST(f.star).hidden)return; if(f.star!=null&&f.dest==null){(byStar[f.star]=byStar[f.star]||[]).push(f);} else drawFleet(f,...w2s(f.x,f.y)); });
  Object.entries(byStar).forEach(([sid,fs])=>{ const s=ST(+sid); if(s.hidden)return; const [x,y]=w2s(s.x,s.y); const grp={}; fs.forEach(f=>(grp[f.owner]=grp[f.owner]||[]).push(f)); Object.keys(grp).forEach((o,k)=>{ const all=grp[o]; drawFleet({owner:+o,ships:all.flatMap(f=>f.ships),monster:all[0].monster},x+16,y-9-k*13); }); });
}
function drawFleet(f,x,y){ const c=ownerCol(f.owner); ctx.save(); ctx.translate(x,y);
  if(f.monster){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(0,-5);ctx.lineTo(5,0);ctx.lineTo(0,5);ctx.lineTo(-5,0);ctx.closePath();ctx.fill(); }
  else { ctx.fillStyle=c; ctx.strokeStyle='#060913'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(6,0);ctx.lineTo(-5,-4.5);ctx.lineTo(-2.5,0);ctx.lineTo(-5,4.5);ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.font='600 9px "JetBrains Mono", monospace'; ctx.fillStyle=c; ctx.textAlign='left'; ctx.fillText(f.ships.length,9,3); ctx.restore(); }

/* pointer handling */
const ptrs=new Map(); let drag=null, pinch=null, moved=false;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,cx:UI.cam.x,cy:UI.cam.y};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:UI.cam.z};drag=null;}});
cv.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];UI.cam.z=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.35,2.6);moved=true;draw();}
  else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>6)moved=true; if(moved){UI.cam.x=clamp(drag.cx-dx/UI.cam.z,0,S.W);UI.cam.y=clamp(drag.cy-dy/UI.cam.z,0,S.H);draw();}}});
const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2)pinch=null; if(ptrs.size===0){ if(!moved&&drag)tap(e.clientX,e.clientY); drag=null; } };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();UI.cam.z=clamp(UI.cam.z*(e.deltaY<0?1.1:.9),.35,2.6);draw();},{passive:false});
function tap(cx,cy){ const r=cv.getBoundingClientRect(); const x=cx-r.left,y=cy-r.top; let best=null,bd=34;
  S.stars.forEach(s=>{if(s.hidden)return;const [sx,sy]=w2s(s.x,s.y);const d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;best=s;}});
  if(UI.moveFid!=null){ if(best)tryMove(best.id); return; }
  if(!best){ const tf=S.fleets.find(f=>f.owner===0&&f.dest!=null&&(()=>{const [fx,fy]=w2s(f.x,f.y);return Math.hypot(fx-x,fy-y)<20;})()); if(tf){openFleetInTransit(tf);return;} UI.sel=null; renderStar(); draw(); return; }
  UI.sel=best.id; UI.split=null; renderStar(); draw(); }
function tryMove(sid){ const f=S.fleets.find(x=>x.id===UI.moveFid); if(!f){cancelMove();return;} const s=ST(sid);
  if(!inRange(me(),s)){toast(s.rift?'Only a fleet with a Dimensional Gate can enter the Rift.':`${s.name} is beyond fuel range (${rangeOf(me())} parsecs from your planets).`);return;}
  if(f.star===sid&&f.dest==null){cancelMove();return;}
  order(f,sid); toast(`Fleet heading to ${s.name}. ETA ${eta(f,sid)} turn${eta(f,sid)>1?'s':''}.`); UI.moveFid=null; $('#moveBanner').hidden=true; UI.sel=sid; renderStar(); draw(); }
function cancelMove(){UI.moveFid=null;$('#moveBanner').hidden=true;draw();}
function startMove(fid){UI.moveFid=fid;$('#moveBanner').hidden=false;$('#moveTxt').textContent='Tap a destination star';$('#starPanel').hidden=true;draw();}
function openFleetInTransit(f){ UI.sel=null; const p=$('#starPanel'); p.hidden=false; p.innerHTML=`<div class="ph"><h2>Fleet in transit</h2><button class="x" data-act="closeStar">×</button></div>${fleetCard(f,true)}`; }

let toastT=0; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}

function shipSummary(ships){ const g={}; ships.forEach(s=>{const k=s.d.name;g[k]=(g[k]||0)+1;}); return Object.entries(g).map(([n,c])=>`${c}× ${n}`).join(', '); }

function fleetCard(f,transit){

      if(f.ships.some(s=>s.d.kind==='transport'))sp.filter(p=>p.owner!=null&&p.owner!==0&&hostile(0,p.owner)).forEach(p=>{ const ok=p.def<=0&&!hostileArmedAt(0,st);
        h+=`<button class="btn sm ${ok?'warn':''}" data-act="invade" data-f="${f.id}" data-p="${p.id}" ${ok?'':'disabled'}>Invade ${esc(p.name)} (${Math.round(defenders(p))} def)</button>`; });
    }

function renderColony(pid){
  UI.colony=pid; const p=P(pid), e=me(); if(p.owner!==0){closeSheet();return;}
  const y=yieldOf(e,p), mp=maxPop(e,p), t=PT[p.type];
  let h=`<div class="card"><div class="kv"><span>${SIZES[p.size]} ${p.type} · ${MINERALS[p.min]} minerals</span><span>${esc(ST(p.star).name)}</span></div>`;

  h+=`<div class="kv"><span>Population</span><span class="num">${fmt(p.pop)} / ${mp}${g>0?` <span style="color:var(--food)">+${g.toFixed(2)}/turn</span>`:''}</span></div><div class="bar"><i style="width:${p.pop/mp*100}%"></i></div>
   <div class="kv" style="margin-top:6px"><span>Defense</span><span class="num">${Math.round(p.def)}/${defMax(p)} · shield ${pShield(p)} · marines ${Math.round(defenders(p))}</span></div>${p.blk?'<div class="note warnTxt">Enemy ships in orbit. Defenses cannot repair.</div>':''}</div>`;

  h+=`<div class="lbl">Workforce</div><div class="card" style="padding:4px 12px">`+
    jr('f','F','var(--food)','Farmers',y.fpf,y.fpf>0?`${y.fpf} food each`:'cannot farm this world')+
    jr('w','W','var(--ind)','Workers',y.ipw,`${y.ipw} production each`)+

     <div class="btns" style="margin-top:8px"><button class="btn sm" data-act="buy" data-p="${pid}" ${e.bc>=buyC&&left>0?'':'disabled'}>Buy for ${buyC} credits</button><button class="btn sm" data-act="qrm" data-p="${pid}" data-i="0">Remove</button></div>`;

const HELP=`<div class="note" style="color:var(--ink);line-height:1.55">
<p><b style="color:var(--brass)">Goal.</b> Win one of three ways: <b>conquer</b> every rival, be <b>elected Sovereign</b> by the Concord (two-thirds of the votes, weighted by population), or <b>seal the Hollow Rift</b> by destroying its Citadel.</p>
<p><b style="color:var(--brass)">Colonies.</b> Each colonist is a Farmer, Worker or Scientist. Every colonist eats 1 food. Planet climate sets food per farmer; mineral richness sets production per worker. Your capital adds a bonus to all three. Tap a planet you own to move people and set what it builds.</p>
<p><b style="color:var(--brass)">Credits.</b> Colonists pay taxes. Buildings and warships cost upkeep. Idle planets make trade goods. You can buy the item a planet is building; it is cheaper once work has started.</p>

<p><b style="color:var(--brass)">War.</b> Enemy fleets and planets at war fight automatically when they meet, and you watch the replay. Planetary defenses repair unless enemy warships sit in orbit. To capture a planet: destroy its defenses, then land Troop Transports with enough marines to beat its defenders.</p>

/* ===== modals ===== */
function showModal(html){ $('#mB').innerHTML=html; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; if(UI.anim){cancelAnimationFrame(UI.anim);UI.anim=null;} nextModal(); }
function nextModal(){ const f=UI.mq.shift(); if(f)f(); }
function queuePostTurn(){
  S.replays.forEach(r=>UI.mq.push(()=>showBattle(r)));
  S.offers.forEach(o=>UI.mq.push(()=>showOffer(o))); S.offers=[];
  if(S.vote)UI.mq.push(showVote);
  const imp=S.events.filter(x=>x.l>=2); if(imp.length)UI.mq.push(()=>showReport(S.events));
  if(S.over)UI.mq.push(showOver);
  if($('#modal').hidden)nextModal();
}
function showReport(evs){ showModal(`<h3>Stardate ${(3500+S.turn/10).toFixed(1)}</h3>${evs.slice().sort((a,b)=>b.l-a.l).map(x=>`<div class="ev"><i style="background:${x.c}"></i><span>${esc(x.t)}</span></div>`).join('')}<div class="btns" style="margin-top:12px">${!me().researching&&availableTechs(me()).length?'<button class="btn" data-act="toResearch">Choose research</button>':''}<button class="btn pri" data-act="closeModal">Continue</button></div>`); }
function showOffer(o){ const e=E(o.from); if(!e.alive)return nextModal();
  showModal(`<h3 style="color:${e.color}">${esc(e.name)}</h3><p>${o.type==='peace'?'Our envoys propose an end to this war. Will you sign a peace treaty?':'We propose a trade treaty. Our merchants will enrich both peoples.'}</p><div class="btns"><button class="btn pri" data-act="offer" data-o="${o.from}" data-k="${o.type}" data-y="1">Accept</button><button class="btn" data-act="offer" data-o="${o.from}" data-k="${o.type}" data-y="0">Decline</button></div>`); }
function showVote(){ const v=S.vote; const [a,b]=v.c.map(E); const pc=v.c.includes(0);
  showModal(`<h3>The Concord convenes</h3><p>Candidates for Sovereign: <b style="color:${a.color}">${esc(a.name)}</b> (${popOf(a)} pop) and <b style="color:${b.color}">${esc(b.name)}</b> (${popOf(b)} pop). A candidate needs two-thirds of all votes.${pc?'':' <span class="warnTxt">If a rival is elected, you lose.</span>'}</p>
   <div class="btns"><button class="btn ${a.id===0?'pri':''}" data-act="vote" data-v="${a.id}">Vote ${a.id===0?'for yourself':esc(RACE[a.race].name)}</button><button class="btn ${b.id===0?'pri':''}" data-act="vote" data-v="${b.id}">Vote ${b.id===0?'for yourself':esc(RACE[b.race].name)}</button><button class="btn" data-act="vote" data-v="-1">Abstain</button></div>`); }
function showOver(){ const o=S.over; const msg=o.win?{conquest:'Every rival has fallen. The galaxy answers to you alone.',council:'The Concord has named you Sovereign of the galaxy.',rift:'The Citadel is ash and the Rift collapses behind it. The Hollow will not return.'}[o.how]:{eliminated:'Your last world has fallen. Your empire passes into history.',council:`The Concord crowned the ${o.by!=null?E(o.by).name:'enemy'}. Your empire must kneel.`}[o.how];
  showModal(`<h3 style="color:${o.win?'var(--brass)':'var(--danger)'}">${o.win?'Victory':'Defeat'}</h3><p>${msg}</p><p class="note">Stardate ${(3500+S.turn/10).toFixed(1)} · turn ${S.turn}</p><div class="btns"><button class="btn pri" data-act="newgame">New game</button><button class="btn" data-act="closeModal">View galaxy</button></div>`); }
function showBattle(r){
  showModal(`<h3>Battle at ${esc(r.star)}</h3><div class="note"><span style="color:${r.cols[0]}">${esc(r.names[0])}</span> vs <span style="color:${r.cols[1]}">${esc(r.names[1])}</span></div><canvas id="bcv"></canvas><div id="bres" class="note">Round 1</div><div class="btns" style="margin-top:10px"><button class="btn" data-act="bskip">Skip</button><button class="btn pri" data-act="closeModal">Continue</button></div>`);
  const c=$('#bcv'), W=c.clientWidth, H=260, d=Math.min(2,devicePixelRatio||1); c.width=W*d;c.height=H*d; const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0);
  const sides=[[],[]]; r.units.forEach((u,i)=>sides[u.s].push(i)); const pos=[];
  sides.forEach((list,s)=>{ const n=list.length, colsN=Math.ceil(n/8); list.forEach((ix,k)=>{ const col=Math.floor(k/8), row=k%8, rows=Math.min(8,n-col*8); pos[ix]={x:s===0?40+col*34:W-40-col*34,y:H/2+(row-(rows-1)/2)*28}; }); });
  let hp=r.start.slice(), round=0, t0=performance.now(), done=false;
  const sizeOf=u=>u.k==='planet'?14:({frigate:6,destroyer:8,cruiser:10,battleship:12,titan:14,doom:16,monster:15}[u.h]||8);
  const frame=now=>{ const el=(now-t0)/900; if(el>=1&&!done){ if(round<r.rounds.length){hp=r.rounds[round].hp;round++;t0=now;} if(round>=r.rounds.length)done=true; }
    g.fillStyle='#04060d';g.fillRect(0,0,W,H);
    const rd=r.rounds[round]; if(rd&&!done){ const p=Math.min(1,(now-t0)/600); rd.shots.forEach(s=>{const a=pos[s.a],b=pos[s.t]; if(!a||!b)return; const col=r.cols[r.units[s.a].s]; g.strokeStyle=col; g.globalAlpha=(1-p)*.8; g.lineWidth=s.h?1.6:.6; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(a.x+(b.x-a.x)*Math.min(1,p*1.6),a.y+(b.y-a.y)*Math.min(1,p*1.6)); g.stroke(); if(s.h&&p>.55){g.fillStyle='#fff';g.globalAlpha=(1-p)*1.6;g.beginPath();g.arc(b.x,b.y,2+s.d*.15,0,7);g.fill();} }); g.globalAlpha=1; }
    r.units.forEach((u,i)=>{ const p=pos[i]; const alive=hp[i]>0, col=r.cols[u.s], sz=sizeOf(u); g.globalAlpha=alive?1:.18; g.fillStyle=col;
      if(u.k==='planet'){g.beginPath();g.arc(p.x,p.y,sz,0,7);g.fill();} else { g.beginPath(); const dir=u.s===0?1:-1; g.moveTo(p.x+sz*dir,p.y); g.lineTo(p.x-sz*.8*dir,p.y-sz*.6); g.lineTo(p.x-sz*.8*dir,p.y+sz*.6); g.closePath(); g.fill(); }
      if(alive&&u.m>0){ g.fillStyle='rgba(255,255,255,.12)'; g.fillRect(p.x-12,p.y+sz+3,24,3); g.fillStyle=hp[i]/u.m>.5?'#6fd18d':hp[i]/u.m>.25?'#f2d36b':'#ef5f5f'; g.fillRect(p.x-12,p.y+sz+3,24*Math.max(0,hp[i])/u.m,3); } g.globalAlpha=1; });
    const lbl=$('#bres'); if(lbl)lbl.innerHTML=done?resultText(r):`Round ${Math.min(round+1,r.rounds.length)} of ${r.rounds.length}`;
    if(!done||now-t0<200)UI.anim=requestAnimationFrame(frame); else UI.anim=null; };
  UI.bskip=()=>{ hp=r.rounds.length?r.rounds[r.rounds.length-1].hp:hp; round=r.rounds.length; done=true; };
  UI.anim=requestAnimationFrame(frame);
}
function resultText(r){ const fin=r.rounds.length?r.rounds[r.rounds.length-1].hp:r.start; const lost=[0,0],tot=[0,0]; r.units.forEach((u,i)=>{ if(u.k==='planet')return; tot[u.s]++; if(fin[i]<=0)lost[u.s]++; });
  const yo=r.pl, th=1-r.pl; return `<b style="color:${r.result==='Victory'?'var(--good)':r.result==='Defeat'?'var(--danger)':'var(--bc)'}">${r.result}.</b> You lost ${lost[yo]} of ${tot[yo]} ships; the enemy lost ${lost[th]} of ${tot[th]}.`; }

  endTurn(){ if(S.over){showOver();return;} if(S.vote){showVote();return;} endTurn(); save(); topbar(); renderStar(); draw(); refreshSheet(); queuePostTurn(); },

    if(k==='war'){ setWar(e,o,true); r.att-=40; S.empires.forEach(x=>{if(x.id!==0&&x.id!==o.id&&x.rel[0])x.rel[0].att-=5;}); msg=`You declared war on the ${o.name}.`; }
    else if(k==='peace'){ if(r.att>-30||power(o)<power(e)*.8){setWar(e,o,false);r.att+=10;msg=`The ${o.name} accepts peace.`;} else {r.att-=2;msg=`The ${o.name} refuses. They smell weakness.`;} }
    else if(k==='trade'){ if(r.att>0){r.trade=e.rel[o.id].trade=true;r.att+=5;msg='Trade treaty signed.';} else {r.att-=1;msg=`The ${o.name} does not trust you enough to trade.`;} }
    else if(k==='pact'){ if(r.att>10){r.pact=e.rel[o.id].pact=true;r.att+=5;msg='Research pact signed.';} else {r.att-=1;msg=`The ${o.name} declines to share its science.`;} }
    else if(k==='gift'){ if(e.bc>=50){e.bc-=50;r.att+=12;msg=`The ${o.name} accepts your gift warmly.`;} }
    toast(msg); renderRaces(); topbar(); },
  offer(d){ const o=E(+d.o), e=me(); if(d.y==='1'){ if(d.k==='peace'){setWar(e,o,false);o.rel[0].att+=10;} else {o.rel[0].trade=e.rel[o.id].trade=true;} toast('Treaty signed.'); } else o.rel[0].att-=5; closeModal(); },
  vote(d){ const v=+d.v; const res=resolveVote(v<0?null:v); topbar();
    showModal(`<h3>Concord result</h3>${res.lines.map(l=>`<div class="ev"><span>${esc(l)}</span></div>`).join('')}<p><b>${esc(res.res)}</b></p><div class="btns"><button class="btn pri" data-act="closeModal">Continue</button></div>`);
    if(S.over)UI.mq.unshift(showOver); save(); },
  bskip(){ UI.bskip&&UI.bskip(); },
  help(){ openSheet('How to play',HELP,'help'); },
  log(){ openSheet('Turn reports',S.log.length?S.log.map(x=>`<div class="ev"><i style="background:${x.c}"></i><span><span class="num" style="color:var(--dim)">${(3500+x.turn/10).toFixed(1)}</span> ${esc(x.t)}</span></div>`).join(''):'<p class="note">Nothing yet.</p>','log'); },
  center(){ const c=P(me().capital); if(c){const s=ST(c.star);UI.cam.x=s.x;UI.cam.y=s.y;} closeSheet(); draw(); },
  newgame(){ $('#modal').hidden=true; UI.mq=[]; $('#sheet').hidden=true; showStart(true); },
  cancelMove,
  pickRace(d){ startOpts.race=d.r; renderStart(); }, pickOpt(d){ startOpts[d.k]=d.v; renderStart(); },
  begin(){ newGame({...startOpts}); $('#start').hidden=true; UI.sel=null; UI.mq=[]; setTab('galaxy'); save(); topbar(); renderStar(); resize();
    UI.mq.push(()=>showModal(`<h3>Stardate 3500.0</h3><p>The ${esc(me().name)} takes its first steps into the stars. Your capital, ${esc(P(me().capital).name)}, has a colony ship, a frigate and two scouts in orbit.</p><p class="note">Send the scouts to nearby stars, and the colony ship to the best world you find. Queue production on your capital, then pick your first research.</p><div class="btns"><button class="btn" data-act="help">How to play</button><button class="btn pri" data-act="closeModal">Begin</button></div>`)); nextModal(); },
  resume(){ $('#start').hidden=true; topbar(); renderStar(); resize(); }
};
function doSplit(){ const f=S.fleets.find(x=>x.id===UI.split.fid); const take=[]; Object.entries(UI.split.c).forEach(([n,c])=>{ for(let i=0;i<c;i++){const s=f.ships.find(s=>s.d.name===n&&!take.includes(s)); if(s)take.push(s);} });
  if(!take.length||take.length===f.ships.length){UI.split=null; return f;} f.ships=f.ships.filter(s=>!take.includes(s)); const nf={id:nid(),owner:0,star:f.star,x:f.x,y:f.y,dest:null,ships:take}; S.fleets.push(nf); UI.split=null; return nf; }
document.addEventListener('click',ev=>{ const b=ev.target.closest('[data-act]'); if(!b||b.disabled)return; const fn=ACT[b.dataset.act]; if(fn){ev.preventDefault();fn(b.dataset,b);} });

/* ===== start / save ===== */
const KEY='vela-sovereign-save-v1'; const startOpts={race:'varnai',size:'medium',diff:'normal'};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k==='b'?undefined:v)); }catch(e){} }
function load(raw){ S=raw; S.empires.forEach(recompute); S.replays=S.replays||[]; S.offers=S.offers||[]; }
function renderStart(){ let has=false; try{has=!!localStorage.getItem(KEY);}catch(e){}
  const o=startOpts; $('#start').innerHTML=`<div class="wrap"><div style="font-family:var(--f-disp);letter-spacing:.3em;font-size:11px;color:var(--dim)">A GALACTIC STRATEGY GAME</div><h1>VELA SOVEREIGN</h1>
  <p class="lead">Four peoples wake to the stars. At the galaxy's heart lies Vela Prime and the Precursor Archive, guarded by the Warden. Beyond the edge, the Hollow are waiting. Explore, expand, exploit and exterminate.</p>
  ${UI.canResume?`<button class="btn pri" style="width:100%;margin:8px 0" data-act="resume">Return to your game</button>`:''}
  <div class="lbl">Choose your people</div><div class="races">${RACES.map(r=>`<button class="race ${o.race===r.id?'on':''}" data-act="pickRace" data-r="${r.id}"><b>${r.name}</b><small>${r.blurb}</small></button>`).join('')}</div>
  <div class="lbl">Galaxy</div><div class="seg">${['small','medium','large'].map(s=>`<button class="${o.size===s?'on':''}" data-act="pickOpt" data-k="size" data-v="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>
  <div class="lbl">Rivals</div><div class="seg">${['easy','normal','hard'].map(s=>`<button class="${o.diff===s?'on':''}" data-act="pickOpt" data-k="diff" data-v="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>
  <button class="btn pri" style="width:100%;margin-top:18px;padding:14px;font-family:var(--f-disp);letter-spacing:.12em" data-act="begin">${UI.canResume||has?'START NEW GAME':'BEGIN'}</button></div>`; }
function showStart(canResume){ UI.canResume=!!canResume&&S&&!S.over; renderStart(); $('#start').hidden=false; }

function start(data){
  makeBg(); new ResizeObserver(resize).observe($('#mapwrap'));
  let raw=data&&data.S; if(!raw){ try{const s=localStorage.getItem(KEY); if(s)raw=JSON.parse(s);}catch(e){} }
  if(raw){ load(raw); if(data&&data.UI){Object.assign(UI.cam,data.UI.cam||{});} else { const c=P(me().capital); const s=c?ST(c.star):S.stars[0]; UI.cam={x:s.x,y:s.y,z:.8}; } topbar(); resize(); }
  else showStart(false);
  setInterval(()=>{ if(S&&S.stars[S.rift]&&!S.stars[S.rift].hidden&&$('#modal').hidden)draw(); },120);
}
window.claude?.hot?.snapshot?.(()=>({S:S?JSON.parse(JSON.stringify(S,(k,v)=>k==='b'?undefined:v)):null,UI:{cam:UI.cam}}));
if(typeof window!=='undefined'&&!window.__HEADLESS){ window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}); }
</script>
